version: "3.8"
#CI-CD support configuration
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wealth-link-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/wealth_link
      - SPRING_DATASOURCE_USERNAME=wealth_link
      - SPRING_DATASOURCE_PASSWORD=wealth_link
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16
    container_name: wealth-link-postgres
    environment:
      POSTGRES_DB: wealth_link
      POSTGRES_USER: wealth_link
      POSTGRES_PASSWORD: wealth_link
    ports:
      - "5432:5432"
    volumes:
      - wealth-link-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth_link -d wealth_link"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wealth-link-pg-data:
